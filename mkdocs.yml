site_name: OpenFisca CEQ — Documentation
site_description: Cœur réutilisable CEQ pour OpenFisca (concepts de revenu, framework de complétion générique)
repo_url: https://github.com/openfisca/openfisca-ceq
repo_name: openfisca/openfisca-ceq

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy

nav:
  - Accueil: index.md
  - Concepts de revenu CEQ: concepts.md
  - Brancher le cœur sur un pays: usage.md
  - Taxes indirectes: indirect-taxation.md
  - Référence d'API: reference.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            docstring_style: sphinx
